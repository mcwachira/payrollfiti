name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Only used to satisfy `prisma generate` during install/build — no real DB is touched.
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payrollfiti
          POSTGRES_PASSWORD: payrollfiti
          POSTGRES_DB: payrollfiti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payrollfiti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payrollfiti:payrollfiti@localhost:5432/payrollfiti
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run API e2e tests
        run: pnpm --filter api test:e2e

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-build-test
    # Skipped on the main-branch push path — docker-push (below) builds and
    # pushes the same images there, so this job only exists to validate that
    # PR branches still produce buildable images.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

  # CD: builds and publishes images to GitHub Container Registry on every
  # push to main, once lint/build/test and e2e have passed. Uses the
  # built-in GITHUB_TOKEN — no external registry credentials required. This
  # publishes images; it does not deploy them anywhere (no hosting target is
  # configured in this repo yet).
  docker-push:
    runs-on: ubuntu-latest
    needs: [lint-build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
