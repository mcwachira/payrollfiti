name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payrollfiti
          POSTGRES_PASSWORD: payrollfiti
          POSTGRES_DB: payrollfiti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payrollfiti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, mbstring, bcmath
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: payrollfiti_test
          DB_USERNAME: payrollfiti
          DB_PASSWORD: payrollfiti
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: payrollfiti_test
          DB_USERNAME: payrollfiti
          DB_PASSWORD: payrollfiti
        run: php artisan test

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

  web:
    name: Web (TanStack Start)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=web...

      - name: Build
        env:
          VITE_API_URL: /api
          VITE_APP_NAME: PayrollFiti
        run: pnpm turbo run build --filter=web...

  docker-build-check:
    name: Validate Dockerfiles build
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t payrollfiti-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t payrollfiti-web:ci .