name: payrollfiti
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payrollfiti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payrollfiti}
      POSTGRES_DB: ${POSTGRES_DB:-payrollfiti}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-payrollfiti} -d ${POSTGRES_DB:-payrollfiti}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-PayrollFiti}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost}

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-payrollfiti}
      DB_USERNAME: ${POSTGRES_USER:-payrollfiti}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payrollfiti}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Nginx now sits in front of both services on one origin, so the
      # browser never makes a cross-origin request — this is really only
      # needed if something calls the API directly, bypassing nginx.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      PAYSLIP_STORAGE_DIR: /var/www/storage/payslips
      DOCUMENT_STORAGE_DIR: /var/www/storage/documents

      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@payrollfiti.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PayrollFiti}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative path works here because nginx proxies /api on the
        # same origin the browser loads the app from. Use an absolute
        # URL instead only if web will ever be accessed without nginx
        # in front of it.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${APP_NAME:-PayrollFiti}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_APP_NAME: ${APP_NAME:-PayrollFiti}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  redis-data: