# nginx/default.conf — reverse proxy in front of web + api
#
# Puts both services behind one origin (http://localhost) so the
# frontend can call the API on a *relative* path (/api/...) instead of
# a separate host:port — this also sidesteps CORS entirely in this
# setup, since browser requests never leave the nginx origin.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Laravel API — proxied at /api, forwarded to the Laravel container's
    # /api routes (routes/api.php)
    location /api/ {
        proxy_pass http://api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> TanStack app
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}